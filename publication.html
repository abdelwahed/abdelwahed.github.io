<!DOCTYPE html>
<html lang="en" xmlns:v-bind="http://www.w3.org/1999/xhtml">
<head>
    <title>Abdelwahed Khamis</title>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--    <link href="https://fonts.googleapis.com/css?family=Fira+Sans:300i,400,400i,500,600,700,800,900" rel="stylesheet">-->

    <link rel="icon" type="image/png" href="images/NTU.png" />
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/slicknav.min.css">
    <link rel="stylesheet" href="css/bootstrap-theme.min.css">
    <!-- Xman CSS -->
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>

<body>
<div class="main-content" v-bind:class="{ 'loaded': isLoaded }">
    <header class="header">
        <nav class="nav-container">
            <ul class="nav-list">
                <li class="nav-item" v-if="index" :class="{ current: currentPage === 'index' }">
                    <a href="index.html" class="nav-link">HOME</a>
                </li>
                <li class="nav-item" v-if="news" :class="{ current: currentPage === 'news' }">
                    <a href="news.html" class="nav-link">NEWS</a>
                </li>
                <li class="nav-item" v-if="publication" :class="{ current: currentPage === 'publication' }">
                    <a href="publication.html" class="nav-link">PUBLICATION</a>
                </li>
            </ul>
        </nav>
    </header>

    <div class="main-wrapper" id="container">
        <div class="container">
            <article class="shadow-lg resume-wrapper">
                <div class="resume-body">
                    <div class="row">
                        <aside class="resume-aside col-sm-12 col-md-12 col-lg-12">
                            <section class="education-section py-3">
                                <h3 class="text-uppercase resume-section-heading mb-4">Publications</h3>
                                <div v-for="(item, index) in publication" class="item mb-3">
                                    <span class="badge text-bg-primary" style="background-color: #ffc107;color:black ">&nbsp;&nbsp;{{item.conf_short}}&nbsp;&nbsp;</span>
                                    <a v-bind:href="item.url" target="_blank"><h4 class="item-title mb-2">{{item.title}}</h4></a>
                                    <div class="item-author">
                                        <span v-for="(item_author, index_author) in item.author">
                                            <span v-if="index_author != 0">, </span>
                                            <span v-if="item.author_order == index_author + 1" class="item-myself">{{item_author}}</span>
                                            <span v-else>{{item_author}}</span>
                                        </span>
                                    </div>
                                    <div class="item-conf-jour">{{item.conf_or_jour}}</div>
                                    <div class="item-resource">
                                        <a v-if="item.resource.hasOwnProperty('paper_url')" v-bind:href="item.resource.paper_url"><i class="fa fa-file-pdf"></i></a>
                                        <a v-if="item.resource.hasOwnProperty('slide_url')" v-bind:href="item.resource.slide_url"><i class="fa fa-file-image"></i></a>
                                        <a v-if="item.resource.hasOwnProperty('video_url')" v-bind:href="item.resource.video_url"><i class="fa fa-file-video"></i></a>
                                        <a v-if="item.resource.hasOwnProperty('code_url')" v-bind:href="item.resource.code_url"><i class="fa fa-github"></i></a>
                                        <a v-if="item.resource.hasOwnProperty('website_url')" v-bind:href="item.resource.website_url"><i class="fa fa-globe"></i></a>
                                    </div>
                                </div>
                            </section>
                        </aside>
                    </div>
                </div>
                <hr>
            </article>
        </div>
    </div>

    <footer class="footer text-center py-4">
        <small class="copyright">{{information}}</small>
    </footer>
</div>

<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/all.min.js"></script>
<script src="js/jquery.nav.js"></script>
<script src="js/jquery.slicknav.min.js"></script>
<script src="js/index-vue.js"></script>
</body>
</html>
