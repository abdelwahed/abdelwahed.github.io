<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Content Manager | Abdelwahed Khamis</title>
  <style>
    body { 
      margin: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .local-only-notice {
      display: none;
      max-width: 500px;
      margin: 100px auto;
      padding: 40px;
      text-align: center;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .local-only-notice h2 {
      color: #1e293b;
      margin-bottom: 16px;
    }
    .local-only-notice p {
      color: #64748b;
      line-height: 1.6;
    }
    .local-only-notice code {
      display: block;
      background: #1e293b;
      color: #fbbf24;
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
      font-size: 14px;
      text-align: left;
      overflow-x: auto;
    }
    .local-only-notice a {
      color: #d97706;
    }
  </style>
</head>
<body>
  <div class="local-only-notice" id="notice">
    <h2>📝 Content Manager</h2>
    <p>The CMS is available for <strong>local editing only</strong>.</p>
    <p>To edit content, run these commands in your terminal:</p>
    <code>cd astro-site<br>npx decap-server &<br>npm run dev</code>
    <p>Then open <a href="http://localhost:4321/admin/">http://localhost:4321/admin/</a></p>
    <p style="margin-top: 30px; font-size: 14px;">
      Or edit files directly on <a href="https://github.com/abdelwahed/abdelwahed.github.io/tree/redesign/astro-modern/astro-site/src/data" target="_blank">GitHub</a>.
    </p>
  </div>

  <script>
    // Check if running locally
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
      // Load Decap CMS for local development
      var script = document.createElement('script');
      script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      document.body.appendChild(script);
    } else {
      // Show notice for production
      document.getElementById('notice').style.display = 'block';
    }
  </script>
</body>
</html>
