<!DOCTYPE html>
<html lang="en" xmlns:v-bind="http://www.w3.org/1999/xhtml">
<head >
    <title>Abdelwahed Khamis</title>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!--    <link href="https://fonts.googleapis.com/css?family=Fira+Sans:300i,400,400i,500,600,700,800,900" rel="stylesheet">-->

    <link rel="icon" type="image/png" href="images/NTU.png" />
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/slicknav.min.css">
    <link rel="stylesheet" href="css/bootstrap-theme.min.css">
    <!-- Xman CSS -->
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>

<body>
<div class="main-content" v-bind:class="{ 'loaded': isLoaded }">
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <div id="header">
        <header class="header">
            <nav class="nav-container">
                <ul class="nav-list">
                    <li class="nav-item" v-if="index" :class="{ current: currentPage === 'index' }">
                        <a href="index.html" class="nav-link">HOME</a>
                    </li>
                    <li class="nav-item" v-if="news" :class="{ current: currentPage === 'news' }">
                        <a href="news.html" class="nav-link">NEWS</a>
                    </li>
                    <li class="nav-item" v-if="publication" :class="{ current: currentPage === 'publication' }">
                        <a href="publication.html" class="nav-link">PUBLICATION</a>
                    </li>
                </ul>
            </nav>
        </header>
    </div>

    <div class="main-wrapper" id="container">
        <div class="container">
            <article class="shadow-lg resume-wrapper">
                <div class="resume-body">
                    <div class="row">
                        <aside class="resume-aside col-sm-12 col-md-12 col-lg-12">
                            <section class="education-section py-3">
                                <h3 class="text-uppercase resume-section-heading mb-4">News</h3>
                                <ul class="news-list">
                                    <li v-for="item in news" class="mb-2">
                                        <div class="item-news-date">[{{item.date}}] <span class="item-news-content" v-html="item.content"></span></div>
                                        <div v-if="item.hasOwnProperty('images')"  class="row">
                                            <div v-for="image in item.images" class="col-sm-12 col-md-4 col-lg-3 news-image-box"><img v-bind:src="image"></div>
                                        </div>
                                    </li>
                                </ul>
                            </section>
                        </aside>
                    </div>
                </div>
                <hr>
            </article>
        </div>
    </div>

    <footer class="footer text-center py-4">
        <small class="copyright">{{information}}</small>
    </footer>
</div>

<script src="js/jquery.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="js/all.min.js"></script>
<script src="js/jquery.nav.js"></script>
<script src="js/jquery.slicknav.min.js"></script>
<script src="js/index-vue.js"></script>
</body>
</html>
